<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Inscripción - Ciclos Formativos de Grado Superior</title>
    
    <meta name="description" content="Formulario oficial de inscripción para Ciclos Formativos de Grado Superior en la provincia de Huelva.">
    <meta name="keywords" content="inscripción, ciclos formativos, grado superior, Huelva, FP">
    <meta name="author" content="IES Inca Garcilaso">
    <meta name="robots" content="index, follow">
    
    <link rel="stylesheet" href="formulario1.css">
</head>
<body>

    <main class="contenedor-formulario">
        <header>
            <h1 class="titulo-principal">HOJA DE INSCRIPCION</h1>
            <p class="subtitulo">EN LOS CICLOS FORMATIVOS DE GRADO SUPERIOR</p>
        </header>
        
        <form action="#" method="post">
            
            <fieldset class="seccion-datos">
                <legend class="titulo-seccion">Datos Personales</legend>
                
                <div class="fila">
                    <div class="campo">
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" name="nombre">
                    </div>
                    <div class="campo">
                        <label for="apellidos">Apellidos:</label>
                        <input type="text" id="apellidos" name="apellidos">
                    </div>
                    <div class="campo">
                        <label for="dni">DNI</label>
                        <input type="text" id="dni" name="dni">
                    </div>
                </div>
                
                <div class="fila">
                    <div class="campo">
                        <label for="localidad">Localidad de Nacimiento:</label>
                        <input type="text" id="localidad" name="localidad">
                    </div>
                    <div class="campo-corto">
                        <label for="provincia">Provincia:</label>
                        <select id="provincia" name="provincia">
                            <option value="huelva" selected>Huelva</option>
                        </select>
                    </div>
                    <div class="campo">
                        <label for="fecha_nacimiento">Fecha de Nacimiento</label>
                        <input type="date" id="fecha_nacimiento" name="fecha_nacimiento">
                    </div>
                </div>
                
                <div class="fila">
                    <div class="campo-largo">
                        <label for="direccion">Dirección</label>
                        <input type="text" id="direccion" name="direccion">
                    </div>
                    <div class="campo">
                        <label for="codigo_postal">Código Postal:</label>
                        <input type="text" id="codigo_postal" name="codigo_postal">
                    </div>
                </div>
            </fieldset>
            
            <fieldset class="seccion-acceso">
                <legend class="titulo-seccion">Forma de Acceso</legend>
                
                <div class="bloque-radio">
                    <label class="opcion-principal">
                        <input type="radio" name="acceso" value="directo"> Directo
                    </label>
                    
                    <div class="sub-opciones">
                        <div class="fila-sub">
                            <label for="bachillerato">Bachillerato Log Modalidad</label>
                            <input type="text" id="bachillerato" name="bach_modalidad">
                        </div>
                        <div class="fila-sub">
                            <label for="experimental">Experimental</label>
                            <input type="text" id="experimental" name="experimental_txt">
                        </div>
                        <div class="fila-sub">
                            <label for="cou">COU Opción</label>
                            <input type="text" id="cou" name="cou_opcion">
                        </div>
                        <div class="fila-sub">
                            <label for="fp2">FP2</label>
                            <input type="text" id="fp2" name="fp2_txt">
                        </div>
                        <div class="fila-sub">
                            <label for="otros_acc">Otros (especifique)</label>
                            <input type="text" id="otros_acc" name="otros_especifique">
                        </div>
                    </div>
                    
                    <label class="opcion-principal">
                        <input type="radio" name="acceso" value="prueba_libre"> Prueba Libre
                    </label>
                </div>
            </fieldset>
            
            <fieldset class="seccion-documentos">
                <legend class="titulo-seccion">Documentos Adjuntados</legend>
                
                <div class="fila-checkbox">
                    <label><input type="checkbox" name="docs" value="dni"> Fotocopia DNI</label>
                    <label><input type="checkbox" name="docs" value="certificado"> Certificado Académico</label>
                </div>
                <div class="fila-checkbox linea-especificar">
                    <label for="otros_doc"><input type="checkbox" name="docs" value="otros"> Otros documentos (especifique)</label>
                    <input type="text" id="otros_doc" name="otros_docs_txt">
                </div>
            </fieldset>
            
            <div class="botones-container">
                <button type="submit" class="btn-enviar">Enviar Solicitud</button>
                <button type="reset" class="btn-limpiar">Limpiar datos</button>
            </div>
            
            <div class="volver-menu">
                <a href="index.html" class="btn-volver">← Volver al menú principal</a>
            </div>
        </form>
    </main>

</body>
</html>
