<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad 8 - Conversor Métrica Distancia</title>
    <meta name="description" content="Conversor interactivo bidireccional entre kilómetros y millas.">
    <link rel="stylesheet" href="actividad8.css">
</head>
<body>
    <header>
        <h1>La Clave del Chef - Actividad 8</h1>
    </header>
    <main class="contenedor">
<a href="../index.html" class="btn-volver">Volver al Menú</a>
        <h2>Conversor Kilómetros ⇄ Millas</h2>
        <form>
            <div class="form-group">
                <label for="valor">Cantidad a convertir:</label>
                <input type="number" id="valor" step="0.0001" min="0" required>
            </div>
            <div class="form-group">
                <label for="tipoConversion">Dirección de conversión:</label>
                <select id="tipoConversion">
                    <option value="kmAMillas">Kilómetros a Millas</option>
                    <option value="millasAKm">Millas a Kilómetros</option>
                </select>
            </div>
            <button type="button" class="btn-enviar" onclick="convertirUnidades()">Convertir</button>
        </form>
        <div id="resultado" class="resultado-box"></div>
    </main>
    <script src="actividad8.js"></script>
</body>
</html>
