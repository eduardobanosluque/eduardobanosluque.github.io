<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad 1 - Verificación de Edad</title>
    <meta name="description" content="Formulario para comprobar si el usuario es mayor o menor de edad.">
    <meta name="keywords" content="javascript, edad, formulario, daw">
    <link rel="stylesheet" href="actividad1.css">
</head>
<body>
    <header>
        <h1>La Clave del Chef - Actividad 1</h1>
    </header>
    <main class="contenedor">
<a href="../index.html" class="btn-volver">Volver al Menú</a>        <h2>Cálculo de Edad</h2>
        <form id="formularioEdad">
            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" required>
            </div>
            <div class="form-group">
                <label for="apellidos">Apellidos:</label>
                <input type="text" id="apellidos" required>
            </div>
            <div class="form-group">
                <label for="edad">Edad:</label>
                <input type="number" id="edad" min="0" required>
            </div>
            <button type="button" class="btn-enviar" onclick="procesarEdad()">Procesar Datos</button>
        </form>
        <div id="resultado" class="resultado-box"></div>
    </main>
    <script src="actividad1.js"></script>
</body>
</html>
