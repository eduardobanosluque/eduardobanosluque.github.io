<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad 5 - Estación por Mes (If)</title>
    <meta name="description" content="Obtiene la estación del año basada en el nombre del mes usando condicionales If.">
    <link rel="stylesheet" href="actividad5.css">
</head>
<body>
    <header>
        <h1>La Clave del Chef - Actividad 5</h1>
    </header>
    <main class="contenedor">
        <a href="../index.html" class="btn-volver">Volver al Menú</a>
        <h2>Estación del Año (Condicionales IF)</h2>
        <form>
            <div class="form-group">
                <label for="mesIf">Escribe el nombre del mes actual:</label>
                <input type="text" id="mesIf" placeholder="Ej: Marzo, Septiembre..." required>
            </div>
            <button type="button" class="btn-enviar" onclick="calcularEstacionIf()">Calcular Estación</button>
        </form>
        <div id="resultado"></div>
    </main>
    <script src="actividad5.js"></script>
</body>
</html>
