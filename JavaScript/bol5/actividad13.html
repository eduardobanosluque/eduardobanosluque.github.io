<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Búsqueda del Tesoro</title>
    <link rel="stylesheet" href="actividad13.css">
</head>
<body>

<div class="container">

    <div class="card">

        <h1>🗺️ Búsqueda del Tesoro</h1>

        <p class="descripcion">
            Encuentra el tesoro oculto en una matriz de 20 × 20.
            Solo dispones de 5 intentos.
        </p>

        <div class="formulario">

            <div>
                <label for="fila">Fila</label>
                <input type="number"
                       id="fila"
                       min="1"
                       max="20"
                       placeholder="1 - 20">
            </div>

            <div>
                <label for="columna">Columna</label>
                <input type="number"
                       id="columna"
                       min="1"
                       max="20"
                       placeholder="1 - 20">
            </div>

            <button id="buscarBtn">Buscar</button>
            <button id="reiniciarBtn">Reiniciar</button>

        </div>

        <div id="mensaje">
            Juego preparado. ¡Comienza la búsqueda!
        </div>

        <div id="intentos">
            Intentos usados: 0 / 5
        </div>

        <div class="tablero-container">
            <div id="tablero"></div>
        </div>

    </div>

</div>

<script src="actividad13.js"></script>
            <a href="../index.html" class="boton volver">Volver a pág principal</a>

</body>
</html>
