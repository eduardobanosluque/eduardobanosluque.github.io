<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad 15 - Sistema de Agenda (Maps)</title>
    <meta name="description" content="Gestión de persistencia en memoria de usuarios mediante colecciones de tipos Map en JavaScript.">
    <link rel="stylesheet" href="actividad15.css">
</head>
<body>
    <header>
        <h1>La Clave del Chef - Actividad 15</h1>
    </header>
    <main class="contenedor">
<a href="../index.html" class="btn-volver">Volver al Menú</a>
        <h2>Agenda Interna (Estructura Map)</h2>
        <form id="agendaForm">
            <div class="form-group">
                <label for="agendaNombre">Nombre Completo:</label>
                <input type="text" id="agendaNombre" required>
            </div>
            <div class="form-group">
                <label for="agendaDni">DNI / NIE:</label>
                <input type="text" id="agendaDni" required>
            </div>
            <div class="flex-botones">
                <button type="button" class="btn-accion" onclick="guardarUsuarioAgenda()">Añadir Usuario</button>
                <button type="button" class="btn-accion btn-visualizar" onclick="listarUsuariosAgenda()">Visualizar Agenda</button>
            </div>
        </form>
        <div id="salidaAgenda" class="resultado-box"></div>
    </main>
    <script src="actividad15.js"></script>
</body>
</html>
