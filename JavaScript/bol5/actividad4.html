<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad 4 - Estación por Mes (Switch)</title>
    <meta name="description" content="Obtiene la estación del año basada en el nombre del mes usando Switch.">
    <link rel="stylesheet" href="actividad4.css">
</head>
<body>
    <header>
        <h1>La Clave del Chef - Actividad 4</h1>
    </header>
    <main class="contenedor">
<a href="../index.html" class="btn-volver">Volver al Menú</a>
        <h2>Estación del Año (Switch)</h2>
        <form>
            <div class="form-group">
                <label for="mes">Escribe el nombre del mes actual:</label>
                <input type="text" id="mes" placeholder="Ej: Enero, Agosto..." required>
            </div>
            <button type="button" class="btn-enviar" onclick="calcularEstacionSwitch()">Calcular Estación</button>
        </form>
        <div id="resultado"></div>
    </main>
    <script src="actividad4.js"></script>
</body>
</html>
