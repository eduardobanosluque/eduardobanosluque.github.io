<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad 14: La Calculadora</title>
    <link rel="stylesheet" href="../estilos.css">
    <link rel="stylesheet" href="actividad14.css">
</head>
<body>

    <div class="contenedor-principal">
        <div class="calculadora">
            
            <div class="pantalla" id="pantalla">0</div>
            
            <div class="botonera">
                <button class="btn btn-rojo" onclick="limpiarPantalla()">C</button>
                <button class="btn btn-naranja" onclick="borrarUltimo()">DEL</button>
                <button class="btn btn-naranja" onclick="operar('/')">÷</button>
                
                <button class="btn btn-gris" onclick="agregarNumero('7')">7</button>
                <button class="btn btn-gris" onclick="agregarNumero('8')">8</button>
                <button class="btn btn-gris" onclick="agregarNumero('9')">9</button>
                <button class="btn btn-naranja" onclick="operar('*')">×</button>
                
                <button class="btn btn-gris" onclick="agregarNumero('4')">4</button>
                <button class="btn btn-gris" onclick="agregarNumero('5')">5</button>
                <button class="btn btn-gris" onclick="agregarNumero('6')">6</button>
                <button class="btn btn-naranja" onclick="operar('-')">-</button>
                
                <button class="btn btn-gris" onclick="agregarNumero('1')">1</button>
                <button class="btn btn-gris" onclick="agregarNumero('2')">2</button>
                <button class="btn btn-gris" onclick="agregarNumero('3')">3</button>
                <button class="btn btn-naranja" onclick="operar('+')">+</button>
                
                <button class="btn btn-gris btn-doble" onclick="agregarNumero('0')">0</button>
                <button class="btn btn-gris" onclick="agregarNumero('.')">.</button>
                <button class="btn btn-verde" onclick="calcularResultado()">=</button>
            </div>

        </div>

        <br>
        <a href="../index.html" class="btn-volver">Volver al Menú</a>
    </div>

    <script src="actividad14.js"></script>
</body>
</html>
