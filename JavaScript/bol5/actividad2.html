<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad 2 - Divisibilidad por Dos</title>
    <meta name="description" content="Comprueba si un número entre 1 y 30 es divisible por dos.">
    <meta name="keywords" content="javascript, modulo, divisible, par">
    <link rel="stylesheet" href="actividad2.css">
</head>
<body>
    <header>
        <h1>La Clave del Chef - Actividad 2</h1>
    </header>
    <main class="contenedor">
<a href="../index.html" class="btn-volver">Volver al Menú</a>
        <h2>Número Par o Impar</h2>
        <form id="formularioDivisible">
            <div class="form-group">
                <label for="numero">Introduce un número (1 al 30):</label>
                <input type="number" id="numero" min="1" max="30" required>
            </div>
            <button type="button" class="btn-enviar" onclick="comprobarDivisibilidad()">Verificar Número</button>
        </form>
        <div id="resultado"></div>
    </main>
    <script src="actividad2.js"></script>
</body>
