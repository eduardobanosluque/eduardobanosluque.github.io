<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad 6 - Desglose e IVA</title>
    <meta name="description" content="Calcula la cantidad total a pagar aplicando diferentes tramos de IVA según el importe bruto.">
    <link rel="stylesheet" href="actividad6.css">
</head>
<body>
    <header>
        <h1>La Clave del Chef - Actividad 6</h1>
    </header>
    <main class="contenedor">
<a href="../index.html" class="btn-volver">Volver al Menú</a>
        <h2>Facturación con IVA Variable</h2>
        <form>
            <div class="form-group">
                <label for="cliente">Nombre del Cliente:</label>
                <input type="text" id="cliente" required>
            </div>
            <div class="form-group">
                <label for="importe">Cantidad de dinero a pagar (€):</label>
                <input type="number" id="importe" min="0" step="0.01" required>
            </div>
            <button type="button" class="btn-enviar" onclick="calcularTotalConIva()">Calcular Total</button>
        </form>
        <div id="resultado" class="resultado-box"></div>
    </main>
    <script src="actividad6.js"></script>
</body>
</html>
